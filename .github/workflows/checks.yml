name: Component checks
on:
  pull_request:
  push:

# No pull_request_target, AI credentials, repository writes or release job.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # Official upstream tags verified with git ls-remote on 2026-10-09.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
      - name: Build and JavaFX behavior checks
        run: xvfb-run -a ./mvnw -B verify
      - name: Admission boundary checks and local packet
        run: |
          python3 scripts/test-admission.py
          python3 scripts/prepare-contribution.py --root . --output .proof/admission/ci-packet
          python3 scripts/admission.py validate --packet .proof/admission/ci-packet/packet.zip
